[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "apiauto"
dynamic = ["version"]
description = "Python client for the apiauto.space used-car API: Encar (Korea), Che168 (China), Copart and IAAI (USA) listings in one JSON format"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "apiauto.space" }]
keywords = [
    "encar",
    "encar api",
    "che168",
    "che168 api",
    "copart",
    "copart api",
    "iaai",
    "korean cars",
    "chinese cars",
    "used cars",
    "car auction",
    "car listings",
    "vehicle data",
    "api client",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://apiauto.space/en/"
Documentation = "https://apiauto.space/en/docs/"
Repository = "https://github.com/apiauto-space/apiauto-python"
Issues = "https://github.com/apiauto-space/apiauto-python/issues"
Changelog = "https://github.com/apiauto-space/apiauto-python/blob/main/CHANGELOG.md"
"Get a demo key" = "https://t.me/apiautospace_bot?start=demo"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15", "mypy>=1.15"]

[tool.hatch.version]
path = "src/apiauto/_version.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "CHANGELOG.md", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/apiauto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "A", "C4", "SIM", "PT", "RUF", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"examples/*" = ["T201"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "examples"]
